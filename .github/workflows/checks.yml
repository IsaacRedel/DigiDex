name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar ferramentas de verificação
        run: python -m pip install -r requirements-dev.txt
      - name: Testar catálogo, lógica e pacote de publicação
        run: npm test
      - name: Validar imagens e orçamento
        run: npm run check:images
      - name: Gerar build
        run: npm run build
      - name: Preparar Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verificar navegação, responsividade, backup e uso offline
        run: npm run test:browser
